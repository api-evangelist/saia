provider: Saia Inc
providerId: saia
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Freight
  - Trucking
  - Logistics
  - LTL
  - B2B
description: Saia is a North American less-than-truckload (LTL) carrier. Its public-facing APIs (rating,
  tracking, pickup, BOL, documents, EDI) are provisioned to contracted shippers, brokers, 3PLs, and TMS
  partners as part of the underlying carrier relationship. There is no public per-call price list and
  no self-serve sign-up.
sources:
  - https://www.saia.com/our-services/customer-technology/api-solutions
notes: Saia does not publish API pricing or plan tiers in any public surface; access is part of the carrier
  relationship and onboarding runs through Saia Customer Technology / Account Management. This artifact
  is intentionally a single Contact Sales plan rather than a fabricated tier.
plans:
  - id: saia-contact-sales
    name: Contact Sales
    type: enterprise
    description: Contracted API access for Saia's carrier services (rating, tracking, pickup, BOL, documents,
      EDI) issued to shippers, brokers, 3PLs, and TMS partners.
    entries:
      - label: Contracted Carrier API Access
        name: contracted_access
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Rating / Tariff API
      - name: Tracking API
      - name: Pickup Request API
      - name: Bill of Lading API
      - name: Imaging / Documents API
      - name: EDI integration
