specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Saia Inc
providerId: saia
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Freight
  - LTL
  - B2B
  - Rate Limiting
description: Saia does not publish API rate limits in any public surface. Rate-limit and throughput parameters
  are defined per onboarding agreement and per partner integration with Saia Customer Technology. This
  artifact is intentionally a Contact Sales placeholder.
sources:
  - https://www.saia.com/our-services/customer-technology/api-solutions
notes: No public per-second / per-minute throttle numbers were located. Limits are negotiated during integration
  onboarding.
limits:
  - name: Contracted API throttling
    scope: account
    metric: varies
    limit: contact carrier integration team
    notes: Saia issues throttle and concurrency expectations during partner onboarding. Numeric values
      are not public.
policies:
  - name: Per-partner enforcement
    description: Throttling is bound to the partner credential / contract; behavior under bursts is set
      with the integration team.
  - name: Onboarding-driven sizing
    description: Throughput is right-sized during onboarding based on shipment volume and use case (rating
      vs tracking vs documents).
maintainers:
