specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Saia Inc
providerId: saia
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Freight
  - LTL
  - B2B
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps placeholder for Saia: API access is bundled with the underlying carrier
  relationship rather than priced per call. The financial unit of consumption is the freight shipment,
  not the API request.'
sources:
  - https://www.saia.com/
notes: Saia does not publish per-call API prices. Cost optimization for Saia consumers is dominated by
  shipment-level economics (rating accuracy, tracking-driven OTIF, document automation), not API metering.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Saia, Inc.
serviceCategory: Freight / LTL Carrier
billingModel:
  pricingCategory: Carrier Tariff (No Direct API Pricing)
  billingFrequency: Per-Shipment / Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Saia
  ServiceCategory: Freight / LTL Carrier
  ProviderName: Saia Inc
  PublisherName: Saia, Inc.
  InvoiceIssuerName: Saia, Inc.
  BillingCurrency: USD
meters:
  - name: shipments
    unit: shipment
    aggregation: sum
    dimensions:
      - origin
      - destination
      - service_level
  - name: api_calls
    unit: request
    aggregation: sum
    dimensions:
      - api_family
principles:
  - name: Visibility
    description: Visibility is shipment-centric — pull data from Saia's invoicing, EDI 210 freight invoice
      feeds, and tracking API to reconcile expected vs actual freight charges.
  - name: Allocation
    description: Allocate by shipping origin, business unit, and SKU / order so freight cost can be attributed
      to the customer or product driving it.
  - name: Optimization
    description: Optimize lane selection, consolidation, and accessorial avoidance via accurate rating
      API use; reduce reweigh / reclass exposure with better dimensioning data.
  - name: Accountability
    description: Logistics ops owns carrier reconciliation. Exception management and dispute filing should
      be tied to specific PRO numbers via the documents API.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
